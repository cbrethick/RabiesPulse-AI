<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="RabiesPulse AI — animal bite help, nearby care and rabies awareness for Chennai." />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>RabiesPulse AI</title>
    <script>
      // apply the saved theme before first paint (no white flash in dark mode)
      try {
        var s = JSON.parse(localStorage.getItem('rp_settings') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <style>
      /* Opening animation: logo pops in, heartbeat draws, then the app "zooms in". */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at 50% 42%, #ffffff 0%, #e8f6f4 70%, #d7efeb 100%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0f2744;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      :root[data-theme='dark'] #splash, :root[data-theme='contrast'] #splash { background: radial-gradient(circle at 50% 42%, #1a2539 0%, #0b1220 75%); color: #e8eef7; }
      #splash img { width: min(46vw, 210px); height: auto; filter: drop-shadow(0 10px 24px rgba(15, 39, 68, 0.22)); animation: sp-pop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both, sp-beat 1.1s ease-in-out 0.75s 1; }
      #splash svg { width: min(54vw, 240px); height: 34px; overflow: visible; }
      #splash path { fill: none; stroke: #c81e1e; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 320; stroke-dashoffset: 320; animation: sp-draw 0.9s ease-out 0.45s forwards; }
      #splash h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.01em; opacity: 0; animation: sp-up 0.5s ease-out 0.7s forwards; }
      #splash p { margin: 0; font-size: 0.9rem; opacity: 0; color: #4a5d75; animation: sp-up 0.5s ease-out 0.9s forwards; }
      #splash.leave { opacity: 0; transform: scale(1.12); pointer-events: none; }
      @keyframes sp-pop { from { transform: scale(0.4) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
      @keyframes sp-beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.08); } 40% { transform: scale(0.98); } 60% { transform: scale(1.05); } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; opacity: 1; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="RabiesPulse AI">
      <img src="./logo.png" alt="" />
      <svg viewBox="0 0 240 34" aria-hidden="true"><path d="M2 17 H70 L82 4 L96 30 L108 10 L118 17 H238" /></svg>
      <h1>RabiesPulse AI</h1>
      <p>Chennai · Bite help &amp; care</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
