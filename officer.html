<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2744" />
    <meta name="description" content="RabiesPulse AI officer dashboard — rabies data analytics and hotspot map for Chennai (demonstration data)." />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>RabiesPulse AI — Officer Dashboard</title>
    <script>
      // apply the saved theme before first paint (no white flash in dark mode)
      try {
        var s = JSON.parse(localStorage.getItem('rp_settings') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/officer/main.tsx"></script>
  </body>
</html>
